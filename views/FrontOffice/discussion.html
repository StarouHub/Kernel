<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Discussion - Kernel</title>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../FrontOffice/css/disscussion.css">
</head>

<body>
  <header class="header d-flex align-items-center">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo">
        <i class="bi bi-hexagon-fill"></i> Kernel
      </a>

      <nav class="navmenu">
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="projets-list.html">Projets</a></li>
          <li><a href="evenements-list.html">Événements</a></li>
          <li><a href="forum.html" style="color: var(--accent-color);">Forum</a></li>
        </ul>
      </nav>

      <a class="btn-getstarted" href="#start">Commencer</a>
    </div>
  </header>

  <main class="container">
    <div class="breadcrumb mt-4 p-3 rounded">
      <a href="index.html">Accueil</a> » <a href="forum.html">Forum</a> » <span>Chargement...</span>
    </div>

    <section class="discussion-header">
      <h1 class="discussion-title">Chargement...</h1>
      <div class="discussion-meta">
        <!-- Sera rempli par JavaScript -->
      </div>
    </section>

    <article class="post-card">
      <div class="post-header">
        <div class="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name">Auteur <span class="user-badge">Auteur</span></div>
          <div class="post-time">Récemment</div>
        </div>
      </div>

      <div class="post-content" style="white-space: pre-line;">
        <p>Chargement du contenu...</p>
      </div>

      <div class="post-actions">
        <button class="action-btn"><i class="bi bi-hand-thumbs-up"></i> J'aime</button>
        <button class="action-btn"><i class="bi bi-chat-left-text"></i> Répondre</button>
        <button class="action-btn solved"><i class="bi bi-check-circle"></i> Résolu</button>
      </div>
    </article>

    <!-- Section des réponses -->
    <section id="replies-section" class="mt-4">
      <h3 class="mb-4"><i class="bi bi-chat-left-text"></i> Réponses</h3>
      <div id="replies-container">
        <!-- Les réponses seront affichées ici dynamiquement -->
      </div>
    </section>

    <section class="reply-form">
      <h4><i class="bi bi-pencil-square"></i> Ajouter une réponse</h4>
      <textarea class="form-control" rows="5" placeholder="Partagez votre réponse ou votre solution..."></textarea>
      <div class="mt-3">
        <button class="btn-submit"><i class="bi bi-send-fill me-2"></i>Publier la réponse</button>
      </div>
    </section>
  </main>

  <aside class="container mt-4">
    <div class="sidebar-card">
      <div class="sidebar-title"><i class="bi bi-journal-text"></i> Sujets liés</div>
      <div class="related-topic">
        <div class="related-topic-title">Introduction à Keras</div>
        <div class="related-topic-meta">12 réponses • 3 jours</div>
      </div>
      <div class="related-topic">
        <div class="related-topic-title">Déploiement modèle</div>
        <div class="related-topic-meta">5 réponses • 1 semaine</div>
      </div>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="../FrontOffice/js/discussion.js"></script>
  
  <style>
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }
  </style>
</body>
</html>
